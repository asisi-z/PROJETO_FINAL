<main class="cadastro-page">
  <section class="cadastro-box">
    <h1>Criar cadastro</h1>
    <p>Preencha seus dados para continuar.</p>

    <form (ngSubmit)="cadastrar()" #cadastroForm="ngForm">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" required [(ngModel)]="nome">

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required [(ngModel)]="email">

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required [(ngModel)]="senha">

      <button type="submit" [disabled]="cadastroForm.invalid">Cadastrar</button>
    </form>

    <p class="feedback">{{ feedbackMessage }}</p>
  </section>
</main>
